name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 类型与构建 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JS 依赖
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: 内核语法检查
        run: python -m compileall -q modeling gateway

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

  window-smoke:
    name: 真启动冒烟 · ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JS 依赖（含 Electron 二进制）
        run: npm ci --no-audit --no-fund

      - name: 构建
        run: npm run build

      - name: 修好 Electron 的 SUID 沙箱助手
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          npx electron --version

      - name: 准备 Xvfb 与中文字体
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb fonts-noto-cjk

      - name: 真启动与像素断言
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" npx electron desktop/tests/window-smoke.cjs

      - name: 上传截图与结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-smoke
          path: screenshots/
          if-no-files-found: warn
