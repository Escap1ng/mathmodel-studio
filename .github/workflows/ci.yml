name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 门禁 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows 是这个产品的主平台，不能只在 Linux 上验过就说能构建
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装契约校验依赖
        run: python -m pip install --upgrade pip "jsonschema>=4.20"

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # CI 不启动窗口，所以跳过 Electron 二进制下载（约 100 MB，纯浪费）。
      # 类型检查需要的 electron 类型仍随 npm 包一起装好。
      # lockfile 提交后这里换成 npm ci。
      - name: 安装 JS 依赖
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: G1 注册表一致性
        run: node scripts/check-registry.mjs

      - name: G1 反向覆盖（门禁必须能变红）
        run: node scripts/check-registry.negative.mjs

      - name: G2 契约校验与版本同源
        run: python scripts/validate_contracts.py

      - name: G3 CLI 退出码契约
        run: python runtime/selfcheck.py

      - name: 运行时语法检查
        run: python -m compileall -q runtime

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: G6 产物冒烟
        run: node scripts/smoke-dist.mjs

  # M0 的判据是「照手册装完能起一个空窗」。这条 job 真下载 Electron、真启动、真截图并按像素断言，
  # 而不是停在「能构建」。gates 那条故意跳过二进制，所以这一段只能在这里补上。
  window-smoke:
    name: 真启动冒烟 · ubuntu
    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JS 依赖（含 Electron 二进制）
        run: npm install --no-audit --no-fund

      - name: 构建
        run: npm run build

      - name: 准备 Xvfb
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb

      - name: G7 无头真启动与像素断言
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" npx electron tests/window-smoke.cjs

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-smoke
          path: screenshots/window-smoke.png
          if-no-files-found: warn
