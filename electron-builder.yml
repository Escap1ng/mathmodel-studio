# electron-builder 配置（M6）
#
# 资源布局：runtime/skills/schemas/VERSION/python/pandoc 都放在 resources/ 下，
# 与 src/main/runtime-env.ts 的 APP_ROOT 对齐；app.asar 里只放 JS 产物。
# vendor/python 与 vendor/pandoc 由 scripts/prepare-vendor.mjs 准备，不入库。
appId: cn.escap1ng.mathmodel-studio
productName: MathModel Studio
copyright: Copyright © 2026 Escap1ng

directories:
  output: release
  buildResources: build

# 只留中英文 Chromium 语言包，其余 locale 不进包（约省 45MB）
electronLanguages:
  - zh-CN
  - en-US

files:
  - out/**/*
  - package.json
  - node_modules/pdfjs-dist/**/*

extraResources:
  - from: runtime
    to: runtime
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: skills
    to: skills
  - from: schemas
    to: schemas
  - from: VERSION
    to: VERSION
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: licenses
    to: licenses
  - from: vendor/python
    to: python
  - from: vendor/pandoc/pandoc.exe
    to: pandoc/pandoc.exe

# 主进程用 createRequire 加载 pdfjs 的 legacy 构建，从 asar 里读 worker/字体不稳。
asarUnpack:
  - node_modules/pdfjs-dist/**

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  # build/installer.nsh 自动被 include，负责把默认安装目录改成桌面的 MathModel Studio。
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # 向导内两张图由 scripts/make-icon.mjs 从 build/icon.svg 生成；assisted 模式下
  # installerHeaderIcon 不生效（只在 oneClick 分支读取），页头图要靠 installerHeader。
  installerHeader: installerHeader.bmp
  installerSidebar: installerSidebar.bmp
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: MathModel Studio
  artifactName: ${name}-${version}-setup.${ext}
