[project]
name = "mms-runtime"
version = "0.3.1"
description = "mathmodel-studio 的 Agent 运行时：技能注册表读取、阶段编排、provider 适配与产物登记"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Escap1ng" }]
# runtime 本身只依赖标准库：注册表读取与校验在 jsonschema 缺席时降级为内置最小校验。
# 技能脚本的依赖（matplotlib 等）不装进 runtime 包，统一写在仓库根 requirements.txt。
dependencies = []

[project.optional-dependencies]
contracts = ["jsonschema>=4.20"]

[project.scripts]
mms = "mms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mms"]

# 大陆网络下 pypi 官方直连可用 KB/s 量级，装依赖前先开镜像：
# [[tool.uv.index]]
# name = "npmmirror"
# url = "https://registry.npmmirror.com/pypi/simple/"
# default = true
# 见 docs/env-setup.md；镜像可用性本身会翻转，失败先换源再判死。
