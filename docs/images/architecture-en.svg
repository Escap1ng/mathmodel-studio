<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="MathModel Studio architecture">
  <rect width="1200" height="640" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="638" fill="none" stroke="#D0D7DE" stroke-width="2"/>
  <text x="40" y="42" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#1E293B">Runtime architecture</text>
  <text x="40" y="64" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B">Desktop, process boundaries and data flow</text>

  <rect x="40" y="92" width="360" height="430" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="64" y="122" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1E293B">Electron desktop</text>

  <rect x="64" y="140" width="312" height="156" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="168" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1A6FC4">Renderer · React</text>
  <text x="84" y="194" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">conversations · phase rail · cards</text>
  <text x="84" y="216" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">figures / paper / score / gates / files</text>
  <text x="84" y="238" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">pdf.js page preview</text>
  <text x="84" y="260" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">renderer process · sandbox</text>

  <rect x="64" y="316" width="312" height="184" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="344" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1A6FC4">Main process</text>
  <text x="84" y="370" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">IPC · channel forwarding · SSE merge</text>
  <text x="84" y="392" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">safeStorage-encrypted model keys</text>
  <text x="84" y="414" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">attachment text (PDF / text / CSV)</text>
  <text x="84" y="436" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">keys never enter the renderer or logs</text>

  <rect x="440" y="212" width="180" height="180" rx="10" fill="#EAF2FB" stroke="#1A6FC4"/>
  <text x="530" y="244" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1A6FC4">Local channel</text>
  <text x="530" y="272" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">HTTP + SSE</text>
  <text x="530" y="296" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">Bearer · loopback only</text>
  <text x="530" y="320" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">replay · cancel</text>
  <text x="530" y="352" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748B">127.0.0.1</text>

  <rect x="660" y="92" width="330" height="430" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="684" y="122" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1E293B">Python runtime</text>

  <rect x="684" y="140" width="282" height="126" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="704" y="168" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1A6FC4">Orchestrator</text>
  <text x="704" y="194" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">phases 0–6 · K2–K6 decision points</text>
  <text x="704" y="216" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">pause &amp; resume · context budget</text>
  <text x="704" y="238" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">provider adapters · event stream</text>

  <rect x="684" y="282" width="282" height="112" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="704" y="310" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1A6FC4">Skill runner</text>
  <text x="704" y="336" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">subprocess · exit codes 0 / 1 / 2</text>
  <text x="704" y="358" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">figures · typesetting · de-AI · audit · score</text>
  <text x="704" y="378" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">loadable by hosts such as Claude Code</text>

  <rect x="684" y="410" width="282" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="704" y="438" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1A6FC4">SQLite</text>
  <text x="704" y="464" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">phase · pending cards · message history</text>
  <text x="704" y="486" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">cross-process recovery</text>

  <rect x="1030" y="140" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1095" y="168" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1A6FC4">Model APIs</text>
  <text x="1095" y="194" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">DeepSeek</text>
  <text x="1095" y="214" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">Qwen</text>
  <text x="1095" y="234" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">Kimi / GLM</text>
  <text x="1095" y="254" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">OpenAI-format</text>
  <text x="1095" y="274" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94A3B8">BYOK</text>

  <rect x="1030" y="330" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1095" y="358" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1A6FC4">Artifacts</text>
  <text x="1095" y="384" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">PNG / PDF / SVG</text>
  <text x="1095" y="404" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">PDF / DOCX</text>
  <text x="1095" y="424" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">logs &amp; commands</text>
  <text x="1095" y="444" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94A3B8">written to disk</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <line x1="400" y1="290" x2="438" y2="290" stroke="#94A3B8" stroke-width="1.5" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <line x1="622" y1="290" x2="658" y2="290" stroke="#94A3B8" stroke-width="1.5" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <line x1="992" y1="215" x2="1028" y2="215" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="992" y1="405" x2="1028" y2="405" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="562" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">Model keys are encrypted by the main process; the runtime reads them through the loopback channel. Keys never reach the renderer, event stream or logs.</text>
</svg>
