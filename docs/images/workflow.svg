<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="阶段轨道与决策点">
  <rect width="1200" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#D0D7DE" stroke-width="2"/>
  <text x="40" y="46" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#1E293B">阶段轨道与决策点</text>
  <text x="40" y="68" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B">推进到判断节点即暂停，确认后继续</text>

  <line x1="90" y1="200" x2="1098" y2="200" stroke="#CBD5E1" stroke-width="2"/>

  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="90" y="156" font-size="12" fill="#1E293B">阶段零</text>
    <text x="90" y="174" font-size="11" fill="#64748B">环境预检</text>
    <text x="258" y="156" font-size="12" fill="#1E293B">阶段一</text>
    <text x="258" y="174" font-size="11" fill="#64748B">赛题分析</text>
    <text x="426" y="156" font-size="12" fill="#1E293B">阶段二</text>
    <text x="426" y="174" font-size="11" fill="#64748B">工作目录</text>
    <text x="594" y="156" font-size="12" fill="#1E293B">阶段三</text>
    <text x="594" y="174" font-size="11" fill="#64748B">算法选择</text>
    <text x="762" y="156" font-size="12" fill="#1E293B">阶段四</text>
    <text x="762" y="174" font-size="11" fill="#64748B">代码实现</text>
    <text x="930" y="156" font-size="12" fill="#1E293B">阶段五</text>
    <text x="930" y="174" font-size="11" fill="#64748B">论文输出</text>
    <text x="1098" y="156" font-size="12" fill="#1E293B">阶段六</text>
    <text x="1098" y="174" font-size="11" fill="#64748B">评分优化</text>

    <circle cx="90" cy="200" r="16" fill="#FFFFFF" stroke="#1A6FC4" stroke-width="2"/>
    <text x="90" y="205" font-size="12" font-weight="600" fill="#1A6FC4">0</text>
    <circle cx="258" cy="200" r="16" fill="#EAF2FB" stroke="#1A6FC4" stroke-width="2"/>
    <text x="258" y="205" font-size="12" font-weight="600" fill="#1A6FC4">1</text>
    <circle cx="426" cy="200" r="16" fill="#EAF2FB" stroke="#1A6FC4" stroke-width="2"/>
    <text x="426" y="205" font-size="12" font-weight="600" fill="#1A6FC4">2</text>
    <circle cx="594" cy="200" r="16" fill="#EAF2FB" stroke="#1A6FC4" stroke-width="2"/>
    <text x="594" y="205" font-size="12" font-weight="600" fill="#1A6FC4">3</text>
    <circle cx="762" cy="200" r="16" fill="#EAF2FB" stroke="#1A6FC4" stroke-width="2"/>
    <text x="762" y="205" font-size="12" font-weight="600" fill="#1A6FC4">4</text>
    <circle cx="930" cy="200" r="16" fill="#EAF2FB" stroke="#1A6FC4" stroke-width="2"/>
    <text x="930" y="205" font-size="12" font-weight="600" fill="#1A6FC4">5</text>
    <circle cx="1098" cy="200" r="16" fill="#EAF2FB" stroke="#1A6FC4" stroke-width="2"/>
    <text x="1098" y="205" font-size="12" font-weight="600" fill="#1A6FC4">6</text>

    <rect x="198" y="248" width="120" height="30" rx="15" fill="#EAF2FB" stroke="#1A6FC4"/>
    <text x="258" y="268" font-size="12" fill="#1A6FC4">K2 赛题确认</text>

    <rect x="534" y="248" width="120" height="30" rx="15" fill="#EAF2FB" stroke="#1A6FC4"/>
    <text x="594" y="268" font-size="12" fill="#1A6FC4">K3 选模卡</text>
    <rect x="534" y="288" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#1A6FC4"/>
    <text x="594" y="308" font-size="12" fill="#1A6FC4">K4 就地解释</text>

    <rect x="702" y="248" width="120" height="30" rx="15" fill="#EAF2FB" stroke="#1A6FC4"/>
    <text x="762" y="268" font-size="12" fill="#1A6FC4">K5 图表返工</text>

    <rect x="1038" y="248" width="120" height="30" rx="15" fill="#EAF2FB" stroke="#1A6FC4"/>
    <text x="1098" y="268" font-size="12" fill="#1A6FC4">K6 评分轮次</text>

    <line x1="258" y1="216" x2="258" y2="246" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="594" y1="216" x2="594" y2="246" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="762" y1="216" x2="762" y2="246" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="1098" y1="216" x2="1098" y2="246" stroke="#94A3B8" stroke-dasharray="3 3"/>
  </g>

  <text x="40" y="366" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">暂停状态、待决卡与消息历史写入 SQLite；关闭窗口或重启进程后仍停在原处。</text>
</svg>
